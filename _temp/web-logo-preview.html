<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../webui/static/wizard-v0.css">
  <title>HarnessNovel Logo Preview</title>
</head>
<body>
  <div class="wizard-shell">
    <aside class="rail">
      <div class="brand-lockup" aria-label="HarnessNovel">
        <img class="brand-mark" src="../webui/static/favicon.svg" alt="">
        <span class="brand-name"><strong>h</strong><strong>a</strong><span>rness</span><strong>N</strong><span>ovel</span></span>
      </div>
      <div class="workspace-switch">
        <label class="rail-label">当前作品</label>
        <select class="workspace-select"><option>测试工作区</option></select>
        <button class="rail-new" type="button">+ 新建工作区</button>
      </div>
      <nav class="workflow-nav">
        <h2>创作流程</h2>
        <button class="workflow-step active"><span class="workflow-step-number">1</span><span><span class="workflow-step-title">参考小说</span><span class="workflow-step-meta">拆解与提炼</span></span></button>
        <button class="workflow-step"><span class="workflow-step-number">2</span><span><span class="workflow-step-title">全书设计</span><span class="workflow-step-meta">世界观与粗略大纲</span></span></button>
      </nav>
      <section class="rail-about" aria-label="项目与作者">
        <p class="rail-about-label">项目与作者</p>
        <a class="rail-project-link" href="https://github.com/XTmingyue/harnessNovel">
          <span>GitHub 仓库</span><small>XTmingyue/harnessNovel&nbsp;↗</small>
        </a>
        <details class="rail-contact" open>
          <summary><span>联系作者</span><small>微信公众号</small></summary>
          <div class="rail-contact-body">
            <img src="../webui/static/author-wechat.jpg" alt="作者微信公众号二维码">
            <p>扫码关注「飞鸟onTheWay」</p>
          </div>
        </details>
      </section>
    </aside>
    <main class="stage">
      <header class="stagebar"><div class="stagebar-left"><span class="stage-path">分步创作与人工确认</span></div></header>
      <div class="step-canvas"></div>
    </main>
  </div>
</body>
</html>
